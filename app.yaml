command:
  - bash
  - -lc
  - >-
    python -m pip install --no-cache-dir -r backend/requirements.txt &&
    cd frontend && npm ci && npm run build &&
    cd ../backend && python run.py
env:
  # Add a Lakebase Autoscaling database resource with key `database`
  # in the Databricks Apps UI. It injects PGHOST/PGPORT/PGUSER/PGDATABASE
  # and app identity. Never put a database password or OAuth token here.
  - name: METADATA_ENGINE
    value: postgres
  - name: LAKEBASE_MODE
    value: "true"
  - name: LAKEBASE_ENDPOINT
    valueFrom: database
  - name: POSTGRES_SCHEMA
    value: dataflow_studio
  - name: POSTGRES_SEARCH_PATH
    value: dataflow_studio,public
  - name: DB_POOL_SIZE
    value: "3"
  - name: DB_MAX_OVERFLOW
    value: "2"
  - name: DB_POOL_RECYCLE
    value: "1800"
  - name: ENABLE_IN_PROCESS_SCHEDULER
    value: "true"
